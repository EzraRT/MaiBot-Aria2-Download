# 运行时 config.toml 由 MaiBot 自动生成；本文件仅供配置参考。
[plugin]
# 配置结构版本独立于插件版本；插件 2.0.0 仍使用 1.0.0，保留旧配置迁移流程。
config_version = "1.0.0"

[general]
enabled = true
downloader = "aria2" # 可选：aria2 / qbittorrent

# aria2
aria2_url = "http://127.0.0.1:6800/jsonrpc"
aria2_token = ""

# qBittorrent 5.2.0+；地址填写 WebUI 根地址，不要添加 /api/v2。
qbittorrent_url = "http://127.0.0.1:8080"
# 在 qBittorrent 设置 → WebUI → API Key 中生成，只填写 Token 本身。
qbittorrent_token = ""
qbittorrent_category = ""
qbittorrent_tags = []

# 两种下载器共用；路径属于所选下载器所在的机器。
download_dir = ""
rpc_timeout = 15.0
# 保存配置后测试当前下载器的连接和认证，最多等待 min(rpc_timeout, 5) 秒。
# enabled=false 时跳过测试；失败原因见插件日志，当前进程继续使用上一次已应用配置。
max_links = 50
allowed_user_ids = []
allowed_group_ids = []
adapter_api_prefix = "maibot-team.snowluma-adapter.adapter.napcat.message"
