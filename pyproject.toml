[project]
name = "maibot-aria2-download"
version = "1.1.0"
description = "Download magnets from quoted MaiBot messages with aria2 or qBittorrent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "EzraRT" }]
dependencies = ["maibot-plugin-sdk>=2.8.2,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.4,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
